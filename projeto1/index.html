<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Login</title>
</head>
<body>
    <form id="form" autocomplete="on">
        <h2>Login</h2>
        <p>
            <label for="usuario">Usuario:</label>
            <input type="text" id="usuario" placeholder="Usuario" required autofocus autocomplete="nickname" size="35">
        </p>
        <p>
            <label for="senha">Senha:</label>
            <input type="password" id="senha" placeholder="Senha" required autocomplete="current-password" size="35">
        </p>
        <button type="submit"> Entrar </button>
    </form>

    <script src="script.js"></script>
</body>
</html>
