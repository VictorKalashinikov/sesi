<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Configurações</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="caixa-login">
        <h2>Configurações</h2>
        <p style="text-align: center; margin-bottom: 20px;">Ajuste de Acessibilidade</p>
        <button type="button" class="btn-menu" onclick="alternarModoEscuro()">Modo Escuro (DARK)</button>
        <button type="button" class="btn-menu" onclick="alternarFonteGrande()">Letras Grandes</button>

        <a href="menu.html" class="link-esqueci" style="text-align: center; margin-top: 20px;">Voltar ao Menu</a>
    </div>

    <script>
        function alternarModoEscuro(){
            document.body.classList.toggle('modo-escuro')
        }

        function alternarFonteGrande(){
            document.body.classList.toggle('font-grande')
        }
    </script>
</body>
